[build-system]
requires = ["setuptools>=42","build", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { include = ["shore"] }

[project]
name = "shore"  
version = "0.1.5"           
description = "python wrapper for ocean code"
authors = [
  { name = "geonda", email = "a.geondzhian@gmail.com" }
]
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = [
  "ase==3.23.0",
  "ipython>=9.4.0",
  "networkx==3.4.1",
  "numpy<2.0.0",
  "paramiko==3.5.0",
  "plotly==5.24.1",
  "seaborn==0.13.2",
  "setuptools==75.3.0",
  "spglib==2.5.0",
  "tqdm==4.66.6",
  "nbformat>=4.2.0",
  "dill>=0.4.0",
  "ipykernel>=6.29.5",
  "jupyter>=1.1.1",
  "ipywidgets>=8.1.7",
]
